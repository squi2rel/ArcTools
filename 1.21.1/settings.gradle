pluginManagement {
    repositories {
        maven { url = 'https://maven.neoforged.net/releases/' }
        gradlePluginPortal()
    }
}
rootProject.name = 'arctools-1.21.1'
includeBuild('../common') {
    name = 'arctools-common-build'
    dependencySubstitution {
        substitute module('com.github.squi2rel.arctools:arctools-common') using project(':')
    }
}
includeBuild('../../multiplatform/common') {
    name = 'arclib-common-build'
    dependencySubstitution {
        substitute module('com.github.squi2rel.arclib:arclib-common') using project(':')
    }
}
include 'fabric'
include 'neoforge'
