plugins { id 'com.gradleup.shadow' }

repositories { maven { url = 'https://maven.neoforged.net/releases/' } }
dependencies {
    compileOnly("net.neoforged.fancymodloader:loader:$rootProject.fml_loader_version") { transitive = false }
    compileOnly('net.neoforged:bus:8.0.5') { transitive = false }
    compileOnly('net.neoforged:mergetool:2.0.0:api') { transitive = false }
}

apply from: rootProject.file('../gradle/loader-packaging.gradle')
apply from: rootProject.file('../gradle/verify-game-isolation.gradle')
